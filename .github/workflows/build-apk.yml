name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/android @capacitor/assets --legacy-peer-deps

      - name: Fix Capacitor webDir configuration
        run: |
          sed -i 's/"webDir":\s*"."/"webDir": "www"/g' capacitor.config.json 2>/dev/null || true
          sed -i 's/webDir:\s*"\."/webDir: "www"/g' capacitor.config.ts 2>/dev/null || true
          sed -i "s/webDir:\s*'\.'/webDir: 'www'/g" capacitor.config.ts 2>/dev/null || true

      - name: Build web project
        run: npm run build --if-present

      - name: Prepare web assets directory
        run: |
          mkdir -p www
          if [ -d "dist" ]; then cp -r dist/* www/ 2>/dev/null || true; fi
          if [ -d "build" ]; then cp -r build/* www/ 2>/dev/null || true; fi
          if [ -f "index.html" ]; then cp index.html www/ 2>/dev/null || true; fi
          if [ ! -f "www/index.html" ]; then echo "Control Finanzas App" > www/index.html; fi

      - name: Sync Capacitor Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Generate App Icons from icon.svg
        run: |
          mkdir -p assets
          SVG_PATH=""
          if [ -f "icon.svg" ]; then SVG_PATH="icon.svg";
          elif [ -f "public/icon.svg" ]; then SVG_PATH="public/icon.svg";
          elif [ -f "src/icon.svg" ]; then SVG_PATH="src/icon.svg";
          elif [ -f "assets/icon.svg" ]; then SVG_PATH="assets/icon.svg";
          fi

          if [ -n "$SVG_PATH" ]; then
            cp "$SVG_PATH" assets/icon.svg
            cp "$SVG_PATH" assets/icon-only.svg 2>/dev/null || true
            npx @capacitor/assets generate --android || true
          fi

      - name: Install Finance Widget (native)
        run: python3 widget/scripts/install-widget.py

      - name: Fix missing Java imports in Widget
        run: |
          cat << 'EOF' > fix_imports.py
          import os
          target_dir = "android/app/src/main/java"
          if os.path.exists(target_dir):
              for root, dirs, files in os.walk(target_dir):
                  for f in files:
                      if f.endswith(".java"):
                          p = os.path.join(root, f)
                          with open(p, "r", encoding="utf-8") as file:
                              c = file.read()
                          if "View." in c and "import android.view.View;" not in c:
                              lines = c.split("\n")
                              for idx, line in enumerate(lines):
                                  if line.startswith("package "):
                                      lines.insert(idx + 1, "import android.view.View;")
                                      break
                              with open(p, "w", encoding="utf-8") as file:
                                  file.write("\n".join(lines))
          EOF
          python3 fix_imports.py

      - name: Exclude legacy Kotlin stdlib dependencies
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: Control-Finanzas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
