<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Finanzas</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#14211F">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F2F5F4;--surf:#FFFFFF;--ink:#14211F;--mute:#66767380;--mute2:#5E6E6B;--line:#DCE4E2;--g:#1F7A5C;--primary:#1F7A5C;--primary-dark:#155C45;--r:#B83A3A;--a:#B87800;--card:#14211F;--cardink:#F2F5F4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1514;--surf:#17211F;--ink:#E8F0EE;--mute2:#93A4A0;--line:#27332F;--g:#4FC29B;--r:#F07C7C;--a:#E8B04A;--card:#E8F0EE;--cardink:#0E1514;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1514;--surf:#17211F;--ink:#E8F0EE;--mute2:#93A4A0;--line:#27332F;--g:#4FC29B;--primary:#4FC29B;--primary-dark:#2E8A68;--r:#F07C7C;--a:#E8B04A;--card:#E8F0EE;--cardink:#0E1514;color-scheme:dark}
/* Tema personalizado: el usuario elige 3 colores en Configuración; se aplican
   como variables inline en <html> desde applyTheme() (data-theme se reserva
   para claro/oscuro). En modo oscuro NO se aplica el fondo elegido, para no
   romper la legibilidad: se conservan el fondo y las superficies oscuras. */
:root{--secondary:#2A9D8F}
.color-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.color-row:last-of-type{border-bottom:0}
.color-row .ct{flex:1}
.color-row .ct b{display:block;font-size:15px}
.color-row .ct span{font-size:13px;color:var(--mute2)}
.color-row input[type=color]{width:52px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surf);flex:none;cursor:pointer}
.color-row .hex{font-family:monospace;font-size:13px;color:var(--mute2);width:74px;text-align:right;text-transform:uppercase}
html{scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.4;padding-top:58px;padding-bottom:24px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:15px;font-weight:600;color:var(--mute2);margin:4px 0 0}
h2{font-size:18px;margin:24px 0 10px;font-weight:800}
.total{background:var(--card);color:var(--cardink);border-radius:20px;padding:20px;margin-top:10px}
.total .n{font-size:40px;font-weight:800;letter-spacing:-1px}
.total .s{opacity:.7;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.item{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.item .t{font-weight:600}.item .m{font-size:13px;color:var(--mute2)}
/* Bloque apagado: cuando el interruptor maestro de Notificaciones está
   desactivado, los recordatorios se ven oscuros y no se pueden tocar. */
.dim{opacity:.45;pointer-events:none}
.daysep{font-size:13px;font-weight:700;color:var(--mute2);margin:14px 0 6px}
.pos{color:var(--g)}.neg{color:var(--r)}
.alert{border-left:5px solid var(--a)}.alert.urg{border-left-color:var(--r)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.bar i.hi{background:var(--r)}
nav{position:fixed;left:0;right:0;top:0;background:var(--nav);border-bottom:1px solid rgba(0,0,0,.15);display:flex;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;z-index:5}
nav button{flex:1;background:none;border:0;color:var(--navink);opacity:.75;font:inherit;font-size:13px;padding:10px 4px;font-weight:600;display:flex;align-items:center;justify-content:center}
nav button.on{color:var(--navink);opacity:1;background:rgba(0,0,0,.14);box-shadow:inset 0 -3px 0 var(--navink)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;border:0;background:var(--primary);color:#fff;font-size:30px;z-index:6;box-shadow:0 4px 14px #0004}
.btn{background:var(--primary);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;width:100%}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn.del{background:none;color:var(--r);border:1px solid var(--r);margin-top:8px}
.sheet{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.box{background:var(--surf);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mute2);margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1 1 30%;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.dot.bill{background:#3B82C4}
.dot.mv{background:var(--secondary)}
.mini{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--g);background:var(--g);color:#fff;margin-top:6px}
.mini.alt{background:none;color:var(--ink);border-color:var(--line)}
.cal-icon{padding:6px 9px;line-height:0}
.cal-icon svg{width:18px;height:18px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surf);color:var(--ink)}
.chip.ed{border-style:dashed}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cal>b{font-size:12px;color:var(--mute2);text-align:center;font-weight:600}
.cd{aspect-ratio:1;border-radius:10px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;gap:3px;cursor:pointer}
.cd.today{box-shadow:inset 0 0 0 2px var(--g)}
.cd.sel{background:var(--ink);color:var(--bg)}
.cd.blank{background:none;border:0;cursor:default}
.dots{display:flex;gap:3px;height:6px}
.dot{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--r)}.dot.cut{background:var(--a)}
.empty{color:var(--mute2);text-align:center;padding:24px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart h3{font-size:15px;margin:16px 0 8px}
.crow{margin-bottom:10px}
.crow .cl{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.ctrack{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.ctrack i{display:block;height:100%;border-radius:5px}
.csvg{width:100%;height:auto;display:block}
.cleg{display:flex;gap:16px;font-size:13px;color:var(--mute2);margin-top:6px;flex-wrap:wrap}
.cleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
a.lnk{color:var(--g);font-weight:600;background:none;border:0;font:inherit;padding:0}
.ed{color:var(--mute2);font-size:15px;flex:none;margin-left:8px}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Agregar movimiento">+</button>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
(function(){
var KEY='misfinanzas_v1',S={accounts:[],tx:[]},tab='home';
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
var TSK=KEY+'_ts',cloud='off',ref=null,pt=null;
function lts(){try{return +localStorage.getItem(TSK)||0}catch(e){return 0}}
function cloudTxt(){return cloud==='ok'?'✓ Guardado automáticamente en tu cuenta':cloud==='sync'?'Guardando…':cloud==='err'?'No se pudo guardar en tu cuenta; los datos siguen en este dispositivo':'Guardado solo en este dispositivo'}
function setCloud(s){cloud=s;var e=document.getElementById('cs');if(e)e.textContent=cloudTxt()}
function push(){if(!ref)return;clearTimeout(pt);setCloud('sync');pt=setTimeout(function(){ref.set({json:JSON.stringify(S),updated:lts()}).then(function(){setCloud('ok')},function(){setCloud('err')})},700)}
function save(){var t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(TSK,String(t))}catch(e){}push();syncWidgetSnapshot();scheduleBillReminders()}
/* Widget de inicio (5x2): puente de datos. El widget nativo no puede leer el
   localStorage del WebView, asi que la app escribe un resumen (saldos, atajos
   por tipo y proximos pagos) en @capacitor/preferences (SharedPreferences
   "CapacitorStorage", clave finanzas_widget_snapshot). Incluye el tema
   (colores personalizados, modo Claro/Oscuro/Automático y si está oscuro)
   para que el widget siga los colores de la app. El widget lo lee desde
   codigo nativo y se actualiza al tocar una pestana y cada 30 min. Sin
   Capacitor (navegador) no hace nada. */
var WKEY='finanzas_widget_snapshot';
function widgetSnapshot(){var avail=0,debt=0;S.accounts.forEach(function(a){var b=balance(a);if(a.type==='credit')debt+=Math.max(0,-b);else avail+=b});var m=monthKeyOf(new Date()),inc=0,exp=0;S.tx.forEach(function(t){if(t.date.slice(0,7)===m){if(t.type==='income')inc+=t.amt;if(t.type==='expense')exp+=t.amt}});var st=settingsDef(),ct=st.customTheme,mode=st.mode||'auto',dark=mode==='dark'||(mode==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);return {updated:Date.now(),theme:{primary:ct.primary,secondary:ct.secondary,background:ct.background,nav:ct.nav,mode:mode,dark:!!dark},avail:+avail.toFixed(2),debt:+debt.toFixed(2),monthInc:+inc.toFixed(2),monthExp:+exp.toFixed(2),presets:PR().map(function(p){return {id:p.id,type:p.type,name:p.name,amt:+p.amt||0}}),bills:BL().slice().sort(function(a,b){return a.next<b.next?-1:1}).slice(0,5).map(function(b){return {id:b.id,name:b.name,amt:+b.amt||0,next:b.next,days:daysTo(b.next),freq:billFreqLabel(b)}})}}
function syncWidgetSnapshot(){try{var C=window.Capacitor;if(!C||!C.Plugins||!C.Plugins.Preferences)return;var r=C.Plugins.Preferences.set({key:WKEY,value:JSON.stringify(widgetSnapshot())});if(r&&r.catch)r.catch(function(){})}catch(e){}}
function initCloud(){if(!window.claude||!claude.use)return;Promise.all([claude.use('db'),claude.use('user')]).then(function(r){var db=r[0],us=r[1];if(!db||!us)return null;return us.id().then(function(uid){if(!uid)return null;ref=db.doc('data/users/'+uid+'/finanzas');return ref.get()})}).then(function(snap){if(!ref)return;var has=S.accounts.length||S.tx.length;if(snap&&snap.exists){var d=snap.data();var newer=d&&d.json&&((+d.updated||0)>lts()||!has);if(newer){var o=JSON.parse(d.json);if(o.accounts&&o.tx){S=o;try{localStorage.setItem(KEY,d.json);localStorage.setItem(TSK,String(+d.updated||Date.now()))}catch(e){}render();setCloud('ok');return}}}if(has)push();else setCloud('ok')}).catch(function(){setCloud('err')})}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* Los montos se redondean a centavos: un cero nunca se muestra con signo menos ("-$0.00"). */
function money(n){var r=Math.round((+n||0)*100)/100;return (r<0?'-':'')+'$'+Math.abs(r).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowTime(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
var TYPES={cash:'Efectivo',debit:'Débito',credit:'Crédito'};
var CATS=['Comida','Transporte','Casa','Servicios','Educación','Salud','Ocio','Compras','Sueldo','Otros'];
function balance(a){var b=+a.initial||0;S.tx.forEach(function(t){
 if(t.type==='income'&&t.acc===a.id)b+=t.amt;
 if(t.type==='expense'&&t.acc===a.id)b-=t.amt;
 if(t.type==='transfer'){if(t.acc===a.id)b-=t.amt;if(t.to===a.id)b+=t.amt}});return Math.round(b*100)/100}
function acc(id){return S.accounts.filter(function(a){return a.id===id})[0]}
// credit: balance is negative when owing
var TORD={cash:0,debit:1,credit:2},TYORD={income:0,expense:1,transfer:2},EVO={due:0,bill:1,cut:2};
function sortedAccs(){return S.accounts.slice().sort(function(a,b){return (TORD[a.type]-TORD[b.type])||a.name.localeCompare(b.name,'es')})}
function cmpType(a,b){return (TYORD[a.type]-TYORD[b.type])||String(a.note||a.cat||'').localeCompare(String(b.note||b.cat||''),'es')}
function cmpEv(x,y){var nx=x.k==='bill'?x.b.name:x.a.name,ny=y.k==='bill'?y.b.name:y.a.name;return (EVO[x.k]-EVO[y.k])||nx.localeCompare(ny,'es')}
function biDay(d){return d<=15?d+15:d-15}
function dayList(d,f){d=+d;if(!(d>0))return [];return f==='biweekly'?[d,biDay(d)].sort(function(x,y){return x-y}):[d]}
function dueDays(a){return dayList(a.dueDay,a.freq)}
function cutDays(a){return dayList(a.cutDay,a.freq)}
function nextDueCard(a){return dueDays(a).map(function(x){return nextDue(x)}).sort(function(x,y){return x.days-y.days})[0]}
function msiSelHtml(t){var std=[0,3,6,9,12,18,24],cur=t.msiSel||(std.indexOf(+t.msi||0)>=0?String(+t.msi||0):'custom');return '<select id="f_msi">'+std.map(function(m){return '<option value="'+m+'"'+(String(m)===cur?' selected':'')+'>'+(m?m+' meses':'Pago único')+'</option>'}).join('')+'<option value="custom"'+(cur==='custom'?' selected':'')+'>Otro…</option></select>'+(cur==='custom'?'<input id="f_msin" type="number" inputmode="numeric" min="2" max="60" placeholder="¿Cuántos meses?" value="'+(t.msi>1?t.msi:'')+'" style="margin-top:8px">':'')}
function nextDue(day){var n=new Date();n.setHours(0,0,0,0);var d=new Date(n.getFullYear(),n.getMonth(),Math.min(day,28+3));
 var last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();d=new Date(n.getFullYear(),n.getMonth(),Math.min(day,last));
 if(d<n){last=new Date(n.getFullYear(),n.getMonth()+2,0).getDate();d=new Date(n.getFullYear(),n.getMonth()+1,Math.min(day,last))}
 return {date:d,days:Math.round((d-n)/864e5)}}
function dueLabel(days){return days===0?'vence hoy':days===1?'vence mañana':'vence en '+days+' días'}

function render(){
 applyTheme();
 var h='';
 if(tab==='home')h=home();else if(tab==='tx')h=txs();else if(tab==='cal')h=cal();else if(tab==='cfg')h=settingsHtml();else h=accs();
 $('app').innerHTML=h;
 var gearSvg='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>';
 $('nav').innerHTML=[['home','Resumen'],['tx','Movimientos'],['cal','Calendario'],['acc','Cuentas'],['cfg',gearSvg,'Configuración']].map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'"'+(t[2]?' aria-label="'+t[2]+'" title="'+t[2]+'"':'')+'>'+t[1]+'</button>'}).join('');
 $('fab').style.display=S.accounts.length?'block':'none';
 if(tab==='cfg')wireSettings();if(tab==='tx')wireTx();checkReminder();
}
/* "Puedes gastar": lo que queda de verdad en efectivo y débito después de
   restar los pagos próximos que vencen este mes y la mensualidad MSI de este
   mes. Los pagos ya hechos este mes no se restan (su fecha ya avanzó). */
function freeMoney(){var avail=0;S.accounts.forEach(function(a){if(a.type!=='credit')avail+=balance(a)});var n=new Date(),y=n.getFullYear(),mo=n.getMonth(),bills=0;BL().forEach(function(b){bills+=(+b.amt||0)*billDatesInMonth(b,y,mo).length});var msi=0;S.accounts.forEach(function(a){if(a.type==='credit')msi+=msiMonth(a)});return Math.round((avail-bills-msi)*100)/100}
function home(){
 if(!S.accounts.length)return '<h1>Mis finanzas</h1><div class="empty"><p>Empieza agregando tu efectivo o una tarjeta.</p><button class="btn" data-act="newacc">Agregar cuenta</button></div>';
 var avail=0,debt=0;S.accounts.forEach(function(a){var b=balance(a);if(a.type==='credit')debt+=Math.max(0,-b)-Math.min(0,-b)*0;else avail+=b});
 var m=monthKeyOf(new Date()),inc=0,exp=0;
 S.tx.forEach(function(t){if(t.date.slice(0,7)===m){if(t.type==='income')inc+=t.amt;if(t.type==='expense')exp+=t.amt}});
 var free=freeMoney(),h='<h1>Dinero disponible</h1><div class="total"><div class="n">'+money(avail)+'</div><div class="s">Deuda en tarjetas: '+money(debt)+'</div><div class="row" style="margin-top:14px"><div><div class="s">Ingresos del mes</div><b>'+money(inc)+'</b></div><div style="text-align:right"><div class="s">Gastos del mes</div><b>'+money(exp)+'</b></div></div><div class="s" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">Puedes gastar: <b>'+money(free)+'</b></div></div>';
 h+=presetsHtml();h+=billsHtml();h+=chartsHtml();
 h+='<button class="btn ghost" data-act="sharereport" style="margin-top:4px">📊 Compartir reporte del mes</button>';
 var al=S.accounts.filter(function(a){return a.type==='credit'&&a.dueDay&&balance(a)<0}).map(function(a){return {a:a,d:nextDueCard(a)}}).sort(function(x,y){return x.d.days-y.d.days});
 if(al.length){h+='<h2>Pagos de tarjeta</h2>';al.forEach(function(o){h+='<div class="item alert '+(o.d.days<=3?'urg':'')+'"><div class="row"><div><div class="t">'+esc(o.a.name)+'</div><div class="m">'+dueLabel(o.d.days)+' · día '+dueDays(o.a).join(' y ')+(o.a.freq==='biweekly'?' (quincenal)':'')+(msiMonth(o.a)>0?' · MSI del mes: '+money(msiMonth(o.a)):'')+'</div></div><div style="text-align:right"><b class="neg">'+money(-balance(o.a))+'</b><br><button type="button" class="mini" data-act="pay" data-id="'+o.a.id+'">Pagar tarjeta</button></div></div></div>'})}
 h+='<h2>Últimos movimientos</h2>'+(S.tx.length?list(S.tx.slice().sort(cmp).slice(0,5)):'<div class="empty">Aún no hay movimientos.</div>');
 return h}
/* Planes MSI de una tarjeta: el dinero pagado (pool) se reparte cubriendo
   primero los planes MSI (plan más viejo primero) y solo lo que sobra va a
   la demás deuda, de la compra más vieja a la más nueva. Antes todo el pool
   iba a la compra más vieja (con o sin MSI), así que pagar la mensualidad no
   avanzaba el plan mientras hubiera deuda vieja sin MSI (el plan se quedaba
   en 0/N): cada pago mensual debe avanzar el contador un pago. */

/* Disponible para gastar, transferir o pagar desde una cuenta: saldo en
   efectivo/débito, crédito disponible (límite − deuda) en tarjetas. */
function availOf(a){if(!a)return 0;if(a.type==='credit')return (+a.limit||0)-Math.max(0,-balance(a));return balance(a)}
/* Efecto de un movimiento sobre el saldo de una cuenta (positivo si le suma). */
function txEffect(t,accId){if(!t)return 0;if(t.type==='income'&&t.acc===accId)return t.amt;if(t.type==='expense'&&t.acc===accId)return -t.amt;if(t.type==='transfer'){if(t.acc===accId)return -t.amt;if(t.to===accId)return t.amt}return 0}
/* Lo disponible que quedaría en la cuenta origen si se guarda newTx en lugar
   de oldTx. Al editar, el saldo ya refleja el movimiento viejo, así que se
   descuenta su efecto antes de aplicar el nuevo. */
function availAfter(srcId,newTx,oldTx){var a=acc(srcId);if(!a)return 0;var b=balance(a);if(oldTx)b-=txEffect(oldTx,srcId);b+=txEffect(newTx,srcId);if(a.type==='credit')return (+a.limit||0)-Math.max(0,-b);return b}
/* Advertencia cuando un gasto, transferencia o pago de tarjeta supera lo
   disponible en la cuenta origen. NO bloquea: el usuario decide. "Seguir"
   guarda el movimiento (la cuenta puede quedar en negativo); "Cancelar"
   no guarda nada y vuelve al formulario. El aviso dice el monto, lo
   disponible y la cuenta. */
function warnOverAvail(amt,a,verb,onYes,onNo){var av=availOf(a);

abel>Modo</label><div class="seg" id="set_mode"><button type="button" data-k="light" class="'+(st.mode==='light'?'on':'')+'">Claro</button><button type="button" data-k="dark" class="'+(st.mode==='dark'?'on':'')+'">Oscuro</button><button type="button" data-k="auto" class="'+(st.mode==='auto'?'on':'')+'">Automático</button></div><div class="m" style="margin-top:6px">Automático sigue el modo de tu dispositivo. En modo oscuro se usan superficies oscuras y tus colores principal y secundario; el color de fondo elegido solo se aplica en modo claro.</div><div class="color-row"><div class="ct"><b>Color principal</b><span>Botones, pestaña activa, encabezados y acentos.</span></div><span class="hex" id="hex_primary">'+esc(st.customTheme.primary)+'</span><input type="color" id="set_color_primary" value="'+esc(st.customTheme.primary)+'" aria-label="Color principal"></div><div class="color-row"><div class="ct"><b>Color secundario</b><span>Acentos secundarios y puntos de MSI en el calendario.</span></div><span class="hex" id="hex_secondary">'+esc(st.customTheme.secondary)+'</span><input type="color" id="set_color_secondary" value="'+esc(st.customTheme.secondary)+'" aria-label="Color secundario"></div><div class="color-row"><div class="ct"><b>Color de fondo</b><span>Fondo de la app (en modo oscuro se mantiene el fondo oscuro).</span></div><span class="hex" id="hex_background">'+esc(st.customTheme.background)+'</span><input type="color" id="set_color_background" value="'+esc(st.customTheme.background)+'" aria-label="Color de fondo"></div><div class="color-row"><div class="ct"><b>Color de la barra de navegación</b><span>Fondo de la barra superior; el texto y los iconos se adaptan para leerse bien.</span></div><span class="hex" id="hex_nav">'+esc(st.customTheme.nav)+'</span><input type="color" id="set_color_nav" value="'+esc(st.customTheme.nav)+'" aria-label="Color de la barra de navegación"></div><button class="btn ghost" id="set_reset_colors" type="button">Restablecer colores</button></div><h2>Datos</h2><div class="item"><div class="t">Datos</div><div class="m">Tus datos se guardan solo en este dispositivo (localStorage) y no se sincronizan con otros dispositivos.</div><div class="m" id="cs" style="margin-top:10px">'+cloudTxt()+'</div></div><div class="item"><div class="t">Respaldo</div><div class="m">Copia tus datos para guardarlos en una nota, o pega un respaldo para recuperarlos. Restaurar reemplaza los datos actuales.</div><button class="btn" id="set_backup" type="button">Ver, copiar o descargar respaldo</button><label style="margin-top:12px">Restaurar respaldo</label><textarea id="set_restore" rows="4" style="'+TA+'" placeholder="Pega aquí tu respaldo"></textarea><button class="btn ghost" id="set_restore_btn" type="button" style="margin-top:10px">Restaurar respaldo</button></div>'+adjHtml()+catsHtml()}
function adjDate(r){var p=(r.date||'').split('-');if(p.length<3)return r.date||'';return (+p[2])+' '+MESES[+p[1]-1].slice(0,3)+' '+p[0]+(r.time?' · '+esc(r.time):'')}
function adjHtml(){var L=ADJ().slice().reverse(),h='<div class="item"><div class="t">Historial de ajustes</div>';if(!L.length)return h+'<div class="m">Aún no hay ajustes. Aparecerán aquí cuando confirmes tus saldos y cambies un monto.</div></div>';return h+L.map(function(r){return '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="t" style="font-size:15px">'+esc(r.name||'Cuenta')+'</div><div class="m">'+esc(r.label||'Saldo')+': '+money(r.prev)+' → '+money(r.next)+' · '+adjDate(r)+'</div></div>'}).join('')+'</div>'}
function wireSettings(){var nm=$('set_notif_master');if(nm)nm.onclick=function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-k');if(!k)return;setMasterNotifications(k==='on')};var tm=$('set_time');if(tm)tm.onchange=function(){var st=settingsDef();st.reminderTime=tm.value||'23:00';save();scheduleLocalReminder()};var en=$('set_enabled');if(en)en.onclick=function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-k');if(!k)return;if(!settingsDef().notificationsEnabled)return;var st=settingsDef();st.reminderEnabled=(k==='on');save();if(st.reminderEnabled)scheduleLocalReminder();else cancelLocalReminder();render()};
var bt=$('set_bill_time');if(bt)bt.onchange=function(){var st=settingsDef();st.billReminderTime=bt.value||'09:00';save();scheduleBillReminders()};var be=$('set_bill_enabled');if(be)be.onclick=function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-k');if(!k)return;if(!settingsDef().notificationsEnabled)return;var st=settingsDef();st.billReminderEnabled=(k==='on');save();if(st.billReminderEnabled)scheduleBillReminders();else cancelBillReminders();render()};
var md=$('set_mode');if(md)md.onclick=function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-k');if(!k)return;var st=settingsDef();st.mode=k;save();applyTheme();render()};
var colorFields=[['primary','set_color_primary','hex_primary'],['secondary','set_color_secondary','hex_secondary'],['background','set_color_background','hex_background'],['nav','set_color_nav','hex_nav']];colorFields.forEach(function(c){var inp=$(c[1]);if(!inp)return;inp.oninput=function(){var st=settingsDef();st.customTheme[c[0]]=inp.value;save();applyTheme();var hx=$(c[2]);if(hx)hx.textContent=inp.value}});var rs=$('set_reset_colors');if(rs)rs.onclick=function(){var st=settingsDef();st.customTheme={primary:DEFAULT_THEME.primary,secondary:DEFAULT_THEME.secondary,background:DEFAULT_THEME.background,nav:DEFAULT_THEME.nav};save();applyTheme();render()};var ts=$('set_test');if(ts)ts.onclick=function(){checkReminder(true)};var bk=$('set_backup');if(bk)bk.onclick=function(){backupForm()};var rb=$('set_restore_btn');if(rb)rb.onclick=function(){restoreFromText($('set_restore').value)};var nca=$('nc_add');if(nca)nca.onclick=function(){var inp=$('nc_set'),nm=inp?inp.value.trim():'';if(!nm){if(inp)inp.focus();return}var ex=allCats().filter(function(c){return c.toLowerCase()===nm.toLowerCase()})[0];if(ex){say('Esa categoría ya existe');return}S.cats=S.cats||[];S.cats.push(nm);save();render()}}

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act],[data-t]');
 if(e.target.id==='sh'){close();return}
 if(!el)return;
 if(el.getAttribute('data-t')){tab=el.getAttribute('data-t');render();window.scrollTo(0,0);return}
 var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
 if(act==='newacc')accForm();
 else if(act==='accmove')txForm(null,{acc:id})
 else if(act==='gcal'){var gu=el.getAttribute('data-u'),gw=null;try{gw=window.open(gu,'_blank')}catch(x){}if(!gw){open('<h2 style="margin-top:0">Abrir en el calendario</h2><div class="m">No se pudo abrir el calendario desde aquí. Copia este enlace y ábrelo en tu navegador:</div><textarea id="gl" readonly rows="4" style="'+TA+'">'+esc(gu)+'</textarea><button class="btn" id="gc" style="margin-top:10px">Copiar enlace</button><button class="btn ghost" id="cn">Cerrar</button>');$('cn').onclick=close;$('gc').onclick=function(){var tt=$('gl');tt.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}say(ok?'Enlace copiado':'Mantén presionado el texto para copiarlo')}}}
 else if(act==='pickcat'){var f=el.getAttribute('data-for');$(f).value=el.getAttribute('data-v');[].forEach.call(el.parentNode.children,function(c){c.classList.toggle('on',c===el)})}
 else if(act==='newcat'){var f2=el.getAttribute('data-for');$('cp_'+f2).insertAdjacentHTML('beforeend','<div style="display:flex;gap:8px;width:100%;margin-top:6px"><input id="nc_in" placeholder="Nombre de la categoría" maxlength="24" style="flex:1"><button type="button" class="chip" data-act="savecat" data-for="'+f2+'">Agregar</button></div>');el.remove();$('nc_in').focus()}
 else if(act==='savecat'){var f3=el.getAttribute('data-for'),nm=$('nc_in').value.trim();if(!nm){$('nc_in').focus();return}var ex=allCats().filter(function(c){return c.toLowerCase()===nm.toLowerCase()})[0];if(!ex){S.cats=S.cats||[];S.cats.push(nm);save();ex=nm}$(f3).value=ex;$('cp_'+f3).innerHTML=chipsInner(f3,ex)}
 else if(act==='delcat'){var cv=el.getAttribute('data-v');S.cats=(S.cats||[]).filter(function(c){return c!==cv});save();render()}
 else if(act==='newbill')billForm();
 else if(act==='newbillcal'){var d0=new Date(),by=d0.getFullYear(),bm=d0.getMonth()+calOff,bd=Math.min(calSel||d0.getDate(),new Date(by,bm+1,0).getDate());billForm({freq:'monthly',next:fmt(new Date(by,bm,bd))})}
 else if(act==='editbill')billForm(Object.assign({},BL().filter(function(x){return x.id===id})[0]));
 else if(act==='paybill'){payBillById(id)}
 else if(act==='newpre')preForm();
 else if(act==='editpre'){preEdit=!preEdit;render()}
 else if(act==='editprebtn')preForm(Object.assign({},PR().filter(function(x){return x.id===id})[0]));
 else if(act==='usepre'){usePresetById(id)}
 else if(act==='calprev'){calOff--;calSel=null;render()}
 else if(act==='calnext'){calOff++;calSel=null;render()}
 else if(act==='caltoday'){calOff=0;calSel=null;render()}
 else if(act==='calday'){var dd=+el.getAttribute('data-d');calSel=dd===calSel?null:dd;render()}
 else if(act==='editacc')accForm(Object.assign({},acc(id)));
 else if(act==='edittx')txForm(Object.assign({},S.tx.filter(function(t){return t.id===id})[0]));
 else if(act==='repeattx'){var o=S.tx.filter(function(t){return t.id===id})[0];if(o)txForm(null,{type:o.type,amt:o.amt,acc:o.acc,to:o.to,cat:o.cat,note:o.note,msi:o.msi,date:today(),time:nowTime()})}
 else if(act==='pay')payForm(id)
 else if(act==='chartview'){var k=el.getAttribute('data-k');if(!k)return;var st=settingsDef();st.chartView=k;save();render()}
 else if(act==='chartperiod'){var k=el.getAttribute('data-k');if(!k)return;var st=settingsDef();st.chartPeriod=k;save();render()}
 else if(act==='export')backupForm()
 else if(act==='sharereport')shareReport()
 else if(act==='import')restoreForm();
});
